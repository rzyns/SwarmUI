services:
  swarmui:
    image: ghcr.io/rzyns/docker-swarmui:development
    build:
      context: .
      # dockerfile: launchtools/StandardDockerfile.docker
      dockerfile: ../docker-swarmui/Dockerfile
    container_name: swarmui
    # uncomment `network_mode: host` if you want to access other services on the host network (eg a separated comfy instance)
    network_mode: host
    volumes:
      - swarmdata:/Data
      - swarmbackend:/dlbackend
      - swarmdlnodes:/src/BuiltinExtensions/ComfyUIBackend/DLNodes

      - type: bind
        source: "/Models"
        target: "/workspace/Models"

      - type: bind
        source: "./output"
        target: "/workspace/output"

      - type: bind
        source: "./src/BuiltinExtensions/ComfyUIBackend/CustomWorkflows"
        target: "/SwarmUI/src/BuiltinExtensions/ComfyUIBackend/CustomWorkflows"
    ports:
      - "7801:7801"
    deploy: &deploy
      resources:
        reservations:
          devices:
            - driver: nvidia
              # change the count to the number of GPUs you want to use.
              count: 1
              capabilities: [gpu]

